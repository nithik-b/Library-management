<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Stacks — Library Catalog</title>
<style>
  :root {
    --ink: #241d14;
    --ink-soft: #5a4f3d;
    --paper: #f2e9d3;
    --paper-shadow: #e4d6ae;
    --green: #17261f;
    --green-light: #223629;
    --brass: #b5883a;
    --brass-light: #d9ab55;
    --rust: #96422f;
    --rule: rgba(36, 29, 20, 0.18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--green);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(213,171,85,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(213,171,85,0.05), transparent 45%);
    color: var(--paper);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--brass);
    padding-bottom: 18px;
    margin-bottom: 36px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .eyebrow {
    font-family: 'Courier New', Courier, monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brass-light);
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Palatino Linotype', Palatino, Georgia, serif;
    font-size: 38px;
    margin: 0;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .count-badge {
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    color: var(--paper);
    background: var(--green-light);
    border: 1px solid var(--brass);
    padding: 6px 14px;
    border-radius: 2px;
    letter-spacing: 0.05em;
  }

  /* ---- Intake slip (add book form) ---- */
  .slip {
    background: var(--paper);
    color: var(--ink);
    padding: 26px 28px 22px;
    border-radius: 3px;
    box-shadow: 0 14px 30px rgba(0,0,0,0.35);
    position: relative;
    margin-bottom: 44px;
  }
  .slip::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: repeating-linear-gradient(90deg, var(--brass) 0 10px, transparent 10px 20px);
    border-radius: 3px 3px 0 0;
  }

  .slip h2 {
    font-family: 'Courier New', Courier, monospace;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 6px 0 18px;
  }

  .slip-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px 18px;
  }

  .field label {
    display: block;
    font-family: 'Courier New', Courier, monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }

  .field input {
    width: 100%;
    padding: 9px 10px;
    background: #fbf6e9;
    border: 1px solid var(--rule);
    border-bottom: 2px solid var(--ink-soft);
    font-family: Georgia, serif;
    font-size: 14.5px;
    color: var(--ink);
    border-radius: 2px;
  }
  .field input:focus {
    outline: 2px solid var(--rust);
    outline-offset: 1px;
  }

  .slip-actions {
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  button {
    font-family: 'Courier New', Courier, monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 12px;
    cursor: pointer;
    border-radius: 2px;
    border: none;
    padding: 11px 20px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }

  .btn-primary {
    background: var(--rust);
    color: #fbf6e9;
  }
  .btn-primary:hover { box-shadow: 0 4px 12px rgba(150,66,47,0.4); }

  #formStatus {
    font-family: 'Courier New', Courier, monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* ---- Catalog grid ---- */
  #catalog {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 2px;
    box-shadow: 0 10px 22px rgba(0,0,0,0.3);
    padding: 18px 18px 16px;
    position: relative;
    border-left: 5px solid var(--brass);
  }

  .call-number {
    font-family: 'Courier New', Courier, monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .card h3 {
    margin: 0 0 4px;
    font-family: 'Palatino Linotype', Palatino, Georgia, serif;
    font-size: 19px;
    font-weight: 400;
    line-height: 1.25;
  }

  .card .author {
    font-style: italic;
    color: var(--ink-soft);
    font-size: 14px;
    margin-bottom: 12px;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Courier New', Courier, monospace;
    font-size: 11.5px;
    color: var(--ink-soft);
    border-top: 1px dashed var(--rule);
    padding-top: 10px;
    margin-top: 10px;
  }

  .status-tab {
    font-family: 'Courier New', Courier, monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 2px;
    border: 1px solid currentColor;
  }
  .status-available { color: #2f5d3a; }
  .status-out { color: var(--rust); }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--ink-soft);
    color: var(--ink);
    padding: 7px 12px;
    font-size: 10.5px;
    flex: 1;
  }
  .btn-ghost:hover { background: rgba(36,29,20,0.06); }
  .btn-ghost:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-remove {
    background: transparent;
    border: 1px solid var(--rust);
    color: var(--rust);
    padding: 7px 12px;
    font-size: 10.5px;
  }
  .btn-remove:hover { background: rgba(150,66,47,0.08); }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--brass-light);
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    border: 1px dashed var(--brass);
    border-radius: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <p class="eyebrow">Book Inventory</p>
        <h1>The Stacks</h1>
      </div>
      <div class="count-badge" id="countBadge">0 titles catalogued</div>
    </header>

    <section class="slip">
      <h2>Accession Slip</h2>
      <form id="bookForm">
        <div class="slip-grid">
          <div class="field">
            <label for="title">Title *</label>
            <input id="title" name="title" required placeholder="Clean Code">
          </div>
          <div class="field">
            <label for="author">Author *</label>
            <input id="author" name="author" required placeholder="Robert Martin">
          </div>
          <div class="field">
            <label for="genre">Genre</label>
            <input id="genre" name="genre" placeholder="Programming">
          </div>
          <div class="field">
            <label for="isbn">ISBN</label>
            <input id="isbn" name="isbn" placeholder="9780132350884">
          </div>
          <div class="field">
            <label for="copies">Copies</label>
            <input id="copies" name="copies" type="number" min="1" value="1">
          </div>
        </div>
        <div class="slip-actions">
          <button type="submit" class="btn-primary">File into catalog</button>
          <span id="formStatus"></span>
        </div>
      </form>
    </section>

    <section id="catalog"></section>
  </div>

<script>
  const API_BASE = "";  

  const form = document.getElementById("bookForm");
  const formStatus = document.getElementById("formStatus");
  const catalog = document.getElementById("catalog");
  const countBadge = document.getElementById("countBadge");

  function callNumber(book) {
    // A cosmetic "catalog number" derived from genre + id, purely decorative
    const tag = (book.genre || "GEN").slice(0, 3).toUpperCase();
    return `${tag}-${String(book.id).padStart(4, "0")}`;
  }

  function renderBooks(books) {
    catalog.innerHTML = "";
    countBadge.textContent = `${books.length} title${books.length === 1 ? "" : "s"} catalogued`;

    if (books.length === 0) {
      catalog.innerHTML = `<div class="empty-state">No titles yet — file the first accession slip above.</div>`;
      return;
    }

    books.forEach(book => {
      const isAvailable = book.available_copies > 0;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="call-number">${callNumber(book)}</div>
        <h3>${escapeHtml(book.title)}</h3>
        <div class="author">${escapeHtml(book.author)}</div>
        <div class="meta-row">
          <span>${book.available_copies} / ${book.total_copies} on shelf</span>
          <span class="status-tab ${isAvailable ? "status-available" : "status-out"}">
            ${isAvailable ? "Available" : "All borrowed"}
          </span>
        </div>
        <div class="card-actions">
          <button class="btn-ghost" data-action="borrow" data-id="${book.id}" ${isAvailable ? "" : "disabled"}>Borrow</button>
          <button class="btn-ghost" data-action="return" data-id="${book.id}" ${book.available_copies < book.total_copies ? "" : "disabled"}>Return</button>
          <button class="btn-remove" data-action="delete" data-id="${book.id}">Remove</button>
        </div>
      `;
      catalog.appendChild(card);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadBooks() {
    const res = await fetch(`${API_BASE}/books`);
    const books = await res.json();
    renderBooks(books);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    formStatus.textContent = "Filing...";

    const payload = {
      title: document.getElementById("title").value.trim(),
      author: document.getElementById("author").value.trim(),
      genre: document.getElementById("genre").value.trim() || null,
      isbn: document.getElementById("isbn").value.trim() || null,
      total_copies: parseInt(document.getElementById("copies").value) || 1,
    };
    payload.available_copies = payload.total_copies;

    try {
      const res = await fetch(`${API_BASE}/books`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || "Request failed");
      }
      form.reset();
      document.getElementById("copies").value = 1;
      formStatus.textContent = "Filed.";
      await loadBooks();
      setTimeout(() => (formStatus.textContent = ""), 1500);
    } catch (err) {
      formStatus.textContent = `Error: ${err.message}`;
    }
  });

  catalog.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;

    try {
      if (action === "borrow") {
        await fetch(`${API_BASE}/books/${id}/borrow`, { method: "PATCH" });
      } else if (action === "return") {
        await fetch(`${API_BASE}/books/${id}/return`, { method: "PATCH" });
      } else if (action === "delete") {
        if (!confirm("Remove this title from the catalog?")) return;
        await fetch(`${API_BASE}/books/${id}`, { method: "DELETE" });
      }
      await loadBooks();
    } catch (err) {
      alert("Something went wrong: " + err.message);
    }
  });

  loadBooks();
</script>
</body>
</html>
